version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: npm
    directories:
      - "/"
      - "!/examples/**"
    "exclude-paths":
      - "examples/**"
    schedule:
      interval: daily
    ignore:
      - dependency-name: "eslint"
      - dependency-name: "typescript"
  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "monthly"
    labels: []
    ignore:
      - dependency-name: "*"
