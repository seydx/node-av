version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    # let a release age first, security updates ignore this
    cooldown:
      default-days: 7
      # our own packages go out at once
      exclude:
        - "@camera.ui/*"
        - "camera.ui"
        - "node-av"
        - "node-av-light"
        - "node-av-lgpl"
        - "@seydx/*"
        - "camera-ui-*"
        - "github.com/cameraui/*"
        - "github.com/seydx/*"
  - package-ecosystem: npm
    directories:
      - "/"
      - "!/examples/**"
    "exclude-paths":
      - "examples/**"
    schedule:
      interval: daily
    # let a release age first, security updates ignore this
    cooldown:
      default-days: 7
      # our own packages go out at once
      exclude:
        - "@camera.ui/*"
        - "camera.ui"
        - "node-av"
        - "node-av-light"
        - "node-av-lgpl"
        - "@seydx/*"
        - "camera-ui-*"
        - "github.com/cameraui/*"
        - "github.com/seydx/*"
    ignore:
      - dependency-name: "eslint"
      - dependency-name: "typescript"
  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "monthly"
    # let a release age first, security updates ignore this
    cooldown:
      default-days: 7
      # our own packages go out at once
      exclude:
        - "@camera.ui/*"
        - "camera.ui"
        - "node-av"
        - "node-av-light"
        - "node-av-lgpl"
        - "@seydx/*"
        - "camera-ui-*"
        - "github.com/cameraui/*"
        - "github.com/seydx/*"
    labels: []
    ignore:
      - dependency-name: "*"
